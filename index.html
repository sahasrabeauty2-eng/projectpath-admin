<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Path Admin Panel - Secure Login">
    <title>Admin Login - Project Path</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">🔐</div>
                <h1 class="login-title">Project Path</h1>
                <p class="login-subtitle">Admin Panel Login</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label for="adminPassword" class="form-label">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password"
                        autocomplete="current-password">
                </div>

                <button type="button" id="loginBtn" class="btn btn-primary">
                    Login to Dashboard
                </button>

                <!-- Error Message -->
                <div id="error" class="error-message"></div>
            </div>
        </div>
    </div>

    <!-- Authentication Script -->
    <script src="assets/js/app.js"></script>
</body>

</html>
